name: Verdict

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verdict
  cancel-in-progress: false

jobs:
  court:
    if: startsWith(github.event.issue.title, 'verdict:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/verdict.js')({ github, context });
      - run: |
          git config user.name "verdict-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/cases.json
          git commit -m "⚖️ Дело по issue #${{ github.event.issue.number }}"
          git pull --rebase
          git push
