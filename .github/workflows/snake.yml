name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=ea580c&color_dots=f5e9df,fdd2b0,fba366,f5762a,c2410c
            dist/snake-dark.svg?palette=github-dark&color_snake=ff6a1f&color_dots=1c120c,5c2a10,a8431a,e0561a,ff7a2f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
