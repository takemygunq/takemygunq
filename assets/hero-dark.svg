<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="nevzorl — Embedded developer: STM32, Raspberry Pi 5, C, Python">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0604"/><stop offset="1" stop-color="#1f1109"/></linearGradient>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#ff6a1f"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#ff6a1f12"/></pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#ff6a1f" stop-opacity=".28"/><stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/></radialGradient>
  <clipPath id="wclip"><rect x="0" y="-4" width="250" height="30"/></clipPath>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .name{font-size:62px;font-weight:800;fill:url(#t);letter-spacing:-1px}
  .sub{font-size:15px;fill:#b0907c}
  .ln{font-size:13.5px;fill:#fff1e6;opacity:0;animation:in .35s ease forwards}
  .l1{animation-delay:.5s} .l2{animation-delay:1.2s} .l3{animation-delay:1.9s} .l4{animation-delay:2.6s} .l5{animation-delay:3.3s}
  .ok{fill:#ff6a1f} .k{fill:#ffb020} .m{fill:#b0907c}
  .cur{animation:blink 1s steps(1) infinite}
  .trace{fill:none;stroke:#ff6a1f;stroke-width:2;stroke-opacity:.25}
  .sig{fill:none;stroke:#ffb020;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:14 400;animation:flow 2.4s linear infinite}
  .s2{animation-delay:.8s} .s3{animation-delay:1.6s} .s4{animation-delay:.4s}
  .led{animation:led 1s steps(1) infinite}
  .wave{animation:scroll 3s linear infinite}
  .orb{animation:float 6s ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes led{50%{opacity:.15}}
  @keyframes flow{from{stroke-dashoffset:414}to{stroke-dashoffset:0}}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-308px)}}
  @keyframes float{50%{transform:translateY(-8px)}}
</style>
<rect width="900" height="300" rx="18" fill="url(#bg)"/>
<rect width="900" height="300" rx="18" fill="url(#g)"/>
<circle class="orb" cx="710" cy="140" r="160" fill="url(#glow)"/>

<g transform="translate(46,38)">
  <circle cx="0" cy="0" r="6" fill="#ef4444"/><circle cx="20" cy="0" r="6" fill="#fbbf24"/><circle cx="40" cy="0" r="6" fill="#ff6a1f"/>
  <text x="62" y="5" class="sub" style="font-size:13px">pi@raspberrypi: ~ — 115200 8N1</text>
</g>
<text x="42" y="114" class="name">nevzorl</text>
<text x="46" y="142" class="sub">Embedded · STM32 · Raspberry Pi · C · Python</text>

<text x="46" y="180" class="ln l1"><tspan class="m">$</tspan> i2cdetect -y 1</text>
<text x="46" y="200" class="ln l2"><tspan class="ok">●</tspan> found <tspan class="k">0x3C</tspan> OLED · <tspan class="k">0x68</tspan> MPU6050 · <tspan class="k">0x76</tspan> BME280</text>
<text x="46" y="220" class="ln l3"><tspan class="m">$</tspan> st-flash write firmware.bin 0x08000000</text>
<text x="46" y="240" class="ln l4"><tspan class="ok">✔</tspan> flashed · <tspan class="m">[uart]</tspan> STM32 boot ok @ 72 MHz</text>
<text x="46" y="260" class="ln l5"><tspan class="m">$</tspan> <tspan class="cur ok">▌</tspan></text>

