  <path class="sig s4" d="M802 168 H850 V250"/>
  <rect x="652" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="652" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="670" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="670" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="688" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="688" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="706" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="706" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="724" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="724" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="742" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="742" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="760" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="760" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="778" y="58" width="8" height="16" rx="2" fill="#b0907c"/><rect x="778" y="206" width="8" height="16" rx="2" fill="#b0907c"/><rect x="618" y="92" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="92" width="16" height="8" rx="2" fill="#b0907c"/><rect x="618" y="110" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="110" width="16" height="8" rx="2" fill="#b0907c"/><rect x="618" y="128" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="128" width="16" height="8" rx="2" fill="#b0907c"/><rect x="618" y="146" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="146" width="16" height="8" rx="2" fill="#b0907c"/><rect x="618" y="164" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="164" width="16" height="8" rx="2" fill="#b0907c"/><rect x="618" y="182" width="16" height="8" rx="2" fill="#b0907c"/><rect x="786" y="182" width="16" height="8" rx="2" fill="#b0907c"/>
  <rect x="634" y="74" width="152" height="132" rx="10" fill="#1c120c" stroke="#ff6a1f" stroke-opacity=".5"/>
  <circle cx="652" cy="92" r="4" fill="none" stroke="#b0907c"/>
  <text x="710" y="138" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#fff1e6;letter-spacing:2px">STM32</text>
  <text x="710" y="160" text-anchor="middle" style="font-size:11px;fill:#b0907c">F103C8T6</text>
